<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Shop - Cuneiform Edition with Debugger</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: #0b0e14; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }

        header { 
            padding: 20px 30px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #11151f;
        }
        
        .logo { 
            font-size: 16px; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            text-transform: uppercase; 
            color: #ffffff; 
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 -1px 1px rgba(255, 255, 255, 0.2);
        }
        .logo span { font-weight: 400; color: #8b9bb4; }

        .main-container { 
            max-width: 540px; 
            width: 100%; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        .registry-header {
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }
        .registry-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 -1px 1px rgba(255, 255, 255, 0.25);
        }
        .registry-header p {
            font-size: 14px;
            color: #8b9bb4;
        }

        .input-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b9bb4;
            margin-bottom: 10px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        input, textarea {
            width: 100%;
            padding: 16px 18px;
            background: #11151f;
            border: 1.5px solid #2563eb;
            border-radius: 14px;
            color: #d1d5db;
            font-size: 16px;
            outline: none;
            box-shadow: inset 5px 5px 10px rgba(0, 0, 0, 0.9), inset -3px -3px 6px rgba(255, 255, 255, 0.04);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 -1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        
        input::placeholder, textarea::placeholder {
            color: #4b5563;
            text-shadow: none;
        }

        input:focus, textarea:focus {
            box-shadow: inset 5px 5px 10px rgba(0, 0, 0, 0.9), inset -3px -3px 6px rgba(255, 255, 255, 0.04), 0 0 15px rgba(37, 99, 235, 0.4);
            color: #ffffff;
        }

        .phone-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(145deg, #2b6ef6, #1d4ed8);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.6), 6px 6px 14px rgba(0, 0, 0, 0.7);
            transition: 0.1s;
        }
        .submit-btn:active {
            transform: translateY(2px);
        }

        .status-box {
            margin-top: 25px;
            padding: 25px;
            font-size: 14px;
            display: none;
            border-radius: 16px;
            background: #11151f;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .status-box.success { border: 1px solid #059669; display: block; }
        .status-box.error { border: 1px solid #dc2626; color: #fca5a5; display: block; text-align: left; }

        /* ऑन-स्क्रीन एरर कंसोल स्टाइल */
        .debug-console {
            margin-top: 30px;
            background: #05070a;
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            color: #f87171;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }
        .debug-console h4 {
            color: #fca5a5;
            margin-bottom: 8px;
            font-size: 13px;
            border-bottom: 1px solid rgba(239, 68, 68, 0.3);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        footer {
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 12px;
            color: #8b9bb4;
            background: #11151f;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Star Shop <span>Merchant Registry</span></div>
    </header>

    <div class="main-container">
        <div class="registry-header">
            <h1>Merchant Registration</h1>
            <p>Enter store credentials to sync with the Cuneiform database ecosystem.</p>
        </div>

        <form id="globalRegForm">
            <div class="input-group">
                <label>दुकान का नाम / Shop Name</label>
                <input type="text" id="shopName" required placeholder="Enter Shop Name">
            </div>

            <div class="input-group">
                <label>संचालक का नाम / Owner Name</label>
                <input type="text" id="ownerName" required placeholder="Enter Owner Name">
            </div>

            <div class="input-group">
                <label>व्यवसाय श्रेणी / Category</label>
                <input type="text" id="category" required placeholder="e.g., Grocery, Medical">
            </div>

            <div class="input-group">
                <label>सुरक्षित पिन / PIN (4 Digits)</label>
                <input type="password" id="customPin" required maxlength="4" placeholder="••••">
            </div>

            <div class="input-group">
                <label>मोबाइल नंबर / Phone Number</label>
                <div class="phone-row">
                    <input type="text" value="+91" readonly style="text-align: center; background: #161e31;">
                    <input type="tel" id="phone" required placeholder="Enter Phone Number">
                </div>
            </div>

            <div class="input-group">
                <label>पूर्ण पता / Full Address</label>
                <textarea id="address" rows="2" required placeholder="Enter Full Address"></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Register Store 🚀
            </button>
            
            <div id="statusBox" class="status-box"></div>

            <!-- लाइव एरर कंसोल बॉक्स -->
            <div class="debug-console" id="debugConsole">
                <h4><span>🐛 Live Error Console</span> <span onclick="clearConsole()" style="cursor:pointer; color:#9ca3af;">[Clear]</span></h4>
                <div id="consoleLogContent">System ready. Waiting for action...</div>
            </div>
        </form>
    </div>

    <footer>
        <p><span>Star Shop Ecosystem</span> — Secured via Supabase Backend Infrastructure.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://fzerbvhdaqifaeabdjkj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ajo-GdO4PcqhQDTcde9m7w_Ib6kzaVM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function logError(message) {
            const consoleContent = document.getElementById('consoleLogContent');
            const timeStr = new Date().toLocaleTimeString();
            consoleContent.innerHTML += `<br><span style="color:#f87171;">[${timeStr}] ${message}</span>`;
            const box = document.getElementById('debugConsole');
            box.scrollTop = box.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('consoleLogContentinnerHTML').innerHTML = 'Console cleared.';
        }

        // Global error catcher
        window.onerror = function(msg, url, line) {
            logError(`JS Error: ${msg} (Line: ${line})`);
        };

        document.getElementById('globalRegForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            
            statusBox.className = 'status-box';
            statusBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            const generatedUuid = crypto.randomUUID();
            const rawPhone = document.getElementById('phone').value.trim();
            const fullPhone = '91' + rawPhone;
            const shopNameVal = document.getElementById('shopName').value.trim();
            const ownerNameVal = document.getElementById('ownerName').value.trim();
            const catVal = document.getElementById('category').value.trim();
            const customPinVal = document.getElementById('customPin').value.trim();
            const addressVal = document.getElementById('address').value.trim();

            const merchantPayload = {
                id: generatedUuid,
                shop_name: shopNameVal,
                owner_name: ownerNameVal,
                category: catVal,
                phone: fullPhone,
                pin: customPinVal,
                address: addressVal,
                is_open_today: true
            };

            try {
                logError(`Attempting insert for: ${shopNameVal}`);
                const { data, error } = await supabaseClient
                    .from('merchants')
                    .insert([merchantPayload]);

                if (error) {
                    logError(`Supabase Error Code: ${error.code} - ${error.message}`);
                    throw error;
                }

                statusBox.className = 'status-box success';
                statusBox.innerHTML = `
                    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 8px; color: #ffffff;">✨ Registered Successfully! ✨</h2>
                    <p style="color: #8b9bb4;">Store data saved to Supabase.</p>
                    <code style="color:#34d399;">UUID: ${generatedUuid}</code>
                `;
                
                document.getElementById('globalRegForm').reset();
            } catch (err) {
                statusBox.className = 'status-box error';
                statusBox.textContent = 'Database Error: ' + err.message;
                logError(`Catch Exception: ${err.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Store 🚀';
            }
        });
    </script>
</body>
</html>
